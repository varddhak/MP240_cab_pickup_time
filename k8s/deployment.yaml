apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp240-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mp240-api
  template:
    metadata:
      labels:
        app: mp240-api
    spec:
      containers:
        - name: cab-api
          image: mp240-api:1.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
