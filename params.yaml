data:
  train: data/raw/train.csv
  later: data/raw/later.csv
  holdout: data/raw/holdout_features.csv
  train_clean: data/processed/train_clean.csv
  target: pickup_eta_min
  group_col: zone
  date_col: date
  id_col: record_id
checks:
  sentinels: [-1, -999, 999, 9999, -9999]
  stuck_min_rows: 20
cleaning:
  unit_fix:
    column: rain_mm
    group_col: zone
    group_value: Old City
    factor: 0.1
  stuck:
    column: surge
    start_date: "2026-03-08"
    end_date: "2026-03-29"
features:
  numeric: [drivers_nearby, distance_to_driver_km, hour, rain_mm, surge, road_closures]
  categorical: [car_type, zone]